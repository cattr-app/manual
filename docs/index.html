			:root {

			}

			img:not(.emoji) {

			img[alt="Настройка клиента"], img[alt="Отчет о работе"], img[alt="Описание задачи"], img[alt="Список задач"], img[alt="Авторизация в клиенте: данные"], img[alt="Авторизация в клиенте: хост"] {

			ul {

				list-style-type: disc;

				margin-block-end: 0;

			#header {

				border-bottom: 1px solid #e4e6f6;

			#header li {
				display: inline-block;
			}

			.sidebar {
				top: calc(38px + (0.5em * var(--base-line-height)));
			}

			main > section > article {
				margin-top: 54px !important;
			}

			#header-logo {
				height: 30px;
				width: 30px;
				vertical-align: middle;
				box-shadow: 0 0 0 0 #000;
			}

			.sidebar-toggle {
				top: auto;
				bottom: 0;
			}

			#header .multiple-item:hover .submenu {
				display: block;
			}

			#header a {
				white-space: nowrap;
			}

			.submenu {
				display: none;
				position: absolute;
				top: 120%;
				right: 50%;
				padding: var(--navbar-menu-padding);
				border-width: var(--navbar-menu-border-width, 0);
				border-style: solid;
				border-color: var(--navbar-menu-border-color);
				border-radius: var(--navbar-menu-border-radius);
				background: var(--navbar-menu-background);
				box-shadow: var(--navbar-menu-box-shadow);
				transform: translate(50%, -0.35em);
			}

			.submenu li {
				width: 100%;
				height: 100%;
				display: inline-block;
				white-space: nowrap;
				padding: 4px 20px;
			}

			.header-container {

			.close {

				font-weight: inherit;
				line-height: inherit;
				color: #000;
				text-shadow: 0 1px 0 #fff;
				opacity: 1;
			}

			.close:not(:disabled):not(.disabled):focus,
			.close:not(:disabled):not(.disabled):hover {

			}

			.common-items,
			.main-items {
				height: 52px;
			}

			.item-url {
				color: #666a99;
			}

			@media (max-width: 767px) {

				}

					text-align: center;
				}
				.sidebar-toggle {

<div id="app"></div>

<script>

    /**
     * List of supported languages
     * @type {Array<String>}
     */
    const SUPPORTED_LANGUAGES = ['en', 'ru'];

    window.$docsify = {
        name: 'Cattr User Manual',

        nameLink: {
            '/ru/': '#/ru/',
            '/en/': '#/en/',
        },

        loadSidebar: true,
        subMaxLevels: 3,
        maxLevel: 3,

        auto2top: true,
        executeScript: true,
        search: {
            depth: 3,
            noData: {
                '/ru/': 'Нет результатов!',
                '/en/': 'No results!',
                '/': 'No results!',
            },
            placeholder: {
                '/ru/': 'Искать...',
                '/en/': 'Search...',
                '/': 'Search...',
            },
        },

        alias: {
            '/(.*)/.*/_sidebar.md': '/$1/_sidebar.md',
        },
    };

    function getLangCookie() {
        var v = document.cookie.match('(^|;) ?lang=([^;]*)(;|$)');
        return v ? v[2] : null;
    };

    // Set root domain cookie, ex: *.cattr.app
    function setLangCookie(lang) {
        var rootDomain = location.hostname.split('.').reverse().splice(0, 2).reverse().join('.');
        document.cookie = 'lang=' + lang + '; domain=' + rootDomain;
    };

    // Get the browser language
    function getUserLang() {
        return typeof navigator.language !== 'undefined' && navigator.language.length
          ? navigator.language.substring(0, 2).toLowerCase() : 'en';
    };

    document.addEventListener('DOMContentLoaded', function () {

        // Get user language
        var lang = getLangCookie() || getUserLang();

        // Falling back to English if detected language is not supported
        lang = SUPPORTED_LANGUAGES.includes(lang) ? lang : 'en';

        var hashSegments = document.location.hash.split('/');
        var hashLang = hashSegments[1];
        if (hashLang !== lang) {
            // Redirect to location approriate to the user's language
            hashSegments[1] = lang;

            var hash = hashSegments.join('/');
            if (hashSegments.length === 2) {
                hash += '/';
            }

            document.location.hash = hash;
        }
    });

    document.addEventListener('click', function (event) {
        if (event.target.tagName !== 'A') {
            return;
        }

        var hash = event.target.href.split('#')[1];
        if (!hash) {
            return;
        }

        var urlLang = hash.split('/')[1];
        setLangCookie(urlLang);
    });
</script>
