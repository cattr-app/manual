name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate sitemap
        run: npm run sitemap

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          test -s _site/index.html
          test -s _site/en/README.md
          test -s _site/ru/README.md
          test -s _site/api/index.html
          if grep -RIlI --include='*.png' '^version https://git-lfs.github.com/spec/v1$' _site; then
            echo 'Unresolved Git LFS pointer found in the site artifact' >&2
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
